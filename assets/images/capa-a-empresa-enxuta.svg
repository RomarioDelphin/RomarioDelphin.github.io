<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">A Empresa Enxuta — Romário Delphin</title>
  <desc id="desc">Capa editorial azul escura com título branco e diagrama geométrico de simplificação em verde água.</desc>
  <defs>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071923"/>
      <stop offset=".58" stop-color="#0D2A35"/>
      <stop offset="1" stop-color="#143844"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop stop-color="#42C8B8"/>
      <stop offset="1" stop-color="#A3E9C9"/>
    </linearGradient>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="1800" fill="url(#ground)"/>
  <rect width="1200" height="1800" fill="url(#grid)"/>
  <rect x="70" y="70" width="1060" height="1660" rx="8" fill="none" stroke="#87E0CD" stroke-opacity=".28" stroke-width="2"/>

  <text x="118" y="171" fill="#A3E9C9" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="7">GESTÃO PRÁTICA</text>
  <path d="M118 213H1082" stroke="#87E0CD" stroke-opacity=".5" stroke-width="2"/>

  <text x="110" y="390" fill="#F4F8F5" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="800" letter-spacing="-5">
    <tspan x="110" dy="0">A EMPRESA</tspan>
    <tspan x="110" dy="132">ENXUTA</tspan>
  </text>
  <rect x="116" y="558" width="284" height="11" rx="5.5" fill="url(#flow)"/>
  <text x="118" y="638" fill="#E0EDEB" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500">
    <tspan x="118" dy="0">Como pequenos negócios e autônomos</tspan>
    <tspan x="118" dy="52">usam IA para reduzir custos, automatizar</tspan>
    <tspan x="118" dy="52">rotinas e vender mais</tspan>
  </text>

  <!-- Original visual metaphor: many tasks converge into one clear process. -->
  <g fill="none" stroke="#84DCCB" stroke-opacity=".32" stroke-width="4">
    <path d="M120 942C282 942 312 1124 528 1124"/>
    <path d="M120 1014C294 1014 328 1124 528 1124"/>
    <path d="M120 1086C290 1086 344 1124 528 1124"/>
    <path d="M120 1162C300 1162 344 1124 528 1124"/>
    <path d="M120 1238C290 1238 340 1124 528 1124"/>
    <path d="M120 1310C290 1310 344 1124 528 1124"/>
  </g>
  <g fill="#173D46" stroke="#79DAC8" stroke-opacity=".7" stroke-width="3">
    <rect x="114" y="920" width="45" height="45" rx="8"/>
    <rect x="114" y="992" width="45" height="45" rx="8"/>
    <rect x="114" y="1064" width="45" height="45" rx="8"/>
    <rect x="114" y="1140" width="45" height="45" rx="8"/>
    <rect x="114" y="1216" width="45" height="45" rx="8"/>
    <rect x="114" y="1288" width="45" height="45" rx="8"/>
  </g>
  <path d="M528 1124H968" fill="none" stroke="url(#flow)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="528" cy="1124" r="27" fill="#78DCC5"/>
  <path d="M932 1086L979 1124L932 1162" fill="none" stroke="#A3E9C9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="1440" fill="#A5C4C5" font-family="Arial, Helvetica, sans-serif" font-size="27" letter-spacing="3">PROCESSOS  •  TEMPO  •  DECISÃO</text>

  <path d="M118 1554H1082" stroke="#87E0CD" stroke-opacity=".5" stroke-width="2"/>
  <text x="118" y="1650" fill="#F4F8F5" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="4">ROMÁRIO DELPHIN</text>
</svg>
